name: flutter_app_scaffold
description: "Flutter app scaffold: bootstrap, networking, storage, routing, error handling, and page lifecycle in one package."
version: 0.4.0
repository: https://github.com/BlueSkyYk/flutter_app_scaffold
issue_tracker: https://github.com/BlueSkyYk/flutter_app_scaffold/issues

environment:
  sdk: ^3.11.5
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^3.3.2

  # 路由
  go_router: ^17.3.0

  # 网络
  dio: ^5.9.2

  # 存储
  shared_preferences: ^2.5.5

  # 日志
  logger: ^2.7.0

  # 屏幕适配
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

